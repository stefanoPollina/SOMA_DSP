<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continuum Soma · Evolving wavetable instrument</title><meta name="description" content="Soma: a playable three-oscillator, four-part wavetable instrument from Continuum."><style>:root{color-scheme:dark;--bg:#090b0e;--panel:#101318;--line:#303640;--text:#e5e8ed;--muted:#929baa;--gold:#efb359;--blue:#70b7e5;--purple:#ae96e6;--accent:var(--gold)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:12px/1.5 'Segoe UI',Arial,sans-serif}button,input,select{font:inherit}button,select,input[type=number],input[type=text]{background:#11151b;border:1px solid #3a424e;border-radius:4px;color:var(--text);padding:9px 12px}button{cursor:pointer;font-size:10px;letter-spacing:.07em}button:hover{border-color:var(--gold);background:#1d232c}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button.active,button.primary{background:var(--gold);border-color:var(--gold);color:#17120a}button.on{border-color:var(--gold);color:var(--gold)}button.danger{color:#ff9d91}select{max-width:100%}input[type=range]{width:100%;accent-color:var(--accent);cursor:ew-resize}label{color:#b3bdca;font-size:10px}h1,h2,h3,p{margin:0}h2{font-size:13px;font-weight:500;letter-spacing:.11em}h3{font-size:11px;letter-spacing:.13em;font-weight:500}.muted{color:var(--muted)}.mono,output{font-family:monospace;font-variant-numeric:tabular-nums}.tiny{font-size:9px;letter-spacing:.08em}.shell{max-width:1540px;margin:auto;padding:0 28px}.head{display:flex;justify-content:space-between;align-items:center;padding:22px 0 18px;gap:20px}.brand{font-size:9px;letter-spacing:.35em;color:var(--muted)}h1{font-size:33px;font-weight:350;letter-spacing:.3em;margin:0}.tag{font-size:10px;color:var(--muted);letter-spacing:.13em}.top{position:sticky;top:0;z-index:10;background:#090b0ef5;backdrop-filter:blur(15px);border-top:
